<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:;" />
<title>OpenAmp</title>
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/main-panel.css" />
<link rel="stylesheet" href="styles/playlist-panel.css" />
<link rel="stylesheet" href="styles/equalizer-panel.css" />
<link rel="stylesheet" href="styles/lyrics-panel.css" />
<link rel="stylesheet" href="styles/theme-guwusoft.css" />
</head>
<body>
  <div id="app-shell">

    <div id="titlebar">
      <span id="titlebar-logo">OpenAmp</span>
      <div id="titlebar-drag"></div>
      <button id="btn-pin" class="titlebar-btn" title="Siempre visible">P</button>
      <button id="btn-minimize" class="titlebar-btn" title="Minimizar">&#9472;</button>
      <button id="btn-maximize" class="titlebar-btn" title="Maximizar">&#9633;</button>
      <button id="btn-close" class="titlebar-btn" title="Cerrar">&#10005;</button>
    </div>

    <div id="app-body">

      <aside id="library-panel">
        <div class="panel-header">BIBLIOTECA</div>
        <div id="library-toolbar">
          <input id="library-search" type="text" placeholder="Buscar..." />
          <button id="btn-add-folder" title="Agregar carpeta">+ Carpeta</button>
          <button id="btn-open-files" title="Abrir archivos">Abrir</button>
        </div>
        <div id="library-organize">
          <div class="organize-row">
            <label for="library-group">Agrupar</label>
            <select id="library-group" title="Como agrupar la biblioteca">
              <option value="album">Album</option>
              <option value="artist">Artista</option>
              <option value="folder">Carpeta</option>
              <option value="genre">Genero</option>
              <option value="year">Ano</option>
              <option value="none">Sin agrupar</option>
            </select>
          </div>
          <div class="organize-row">
            <label for="library-sort">Ordenar</label>
            <select id="library-sort" title="Criterio de orden">
              <option value="track">N&deg; de pista</option>
              <option value="title">Titulo</option>
              <option value="artist">Artista</option>
              <option value="album">Album</option>
              <option value="year">Ano</option>
              <option value="duration">Duracion</option>
              <option value="added">Agregado</option>
            </select>
            <button id="btn-library-sort-dir" title="Invertir el orden">&#9650;</button>
          </div>
        </div>
        <div id="library-scan-status" class="hidden"></div>
        <div id="library-list"></div>
      </aside>

      <main id="main-area">

        <section id="panel-main">
          <div id="display-row">
            <div id="album-art">
              <img id="album-art-img" alt="" />
              <button id="btn-albumart-max" title="Agrandar caratula">&#9635;</button>
            </div>
            <div id="visualizer-wrap">
              <canvas id="visualizer" width="76" height="32"></canvas>
              <div id="lyrics-overlay" class="hidden">
                <div id="lyrics-overlay-prev"></div>
                <div id="lyrics-overlay-current"></div>
                <div id="lyrics-overlay-next"></div>
              </div>
              <div id="visualizer-tools">
                <button id="btn-visualizer-mode" title="Barras / osciloscopio">&#9776;</button>
                <button id="btn-visualizer-fullscreen" title="Pantalla completa del monitor">&#9974;</button>
                <button id="btn-visualizer-max" title="Modo visualizador">&#9635;</button>
              </div>
            </div>
            <div id="display-info">
              <div id="track-marquee" class="lcd-text"></div>
              <div id="time-row">
                <span id="time-display" class="lcd-text">00:00 / 00:00</span>
                <span id="track-format" class="lcd-text"></span>
              </div>
            </div>
          </div>

          <div id="seek-row">
            <input id="seek-bar" type="range" min="0" max="1000" value="0" />
          </div>

          <div id="transport-row">
            <button id="btn-prev" class="transport-btn" title="Anterior">&#9664;&#9664;</button>
            <button id="btn-play" class="transport-btn" title="Reproducir">&#9654;</button>
            <button id="btn-pause" class="transport-btn" title="Pausar">&#10074;&#10074;</button>
            <button id="btn-stop" class="transport-btn" title="Detener">&#9632;</button>
            <button id="btn-next" class="transport-btn" title="Siguiente">&#9654;&#9654;</button>

            <button id="btn-shuffle" class="toggle-btn" title="Aleatorio">SHUF</button>
            <button id="btn-repeat" class="toggle-btn" title="Repetir">REP</button>

            <div class="slider-group">
              <label>VOL</label>
              <input id="volume-slider" type="range" min="0" max="100" value="80" />
            </div>
            <div class="slider-group">
              <label>BAL</label>
              <input id="balance-slider" type="range" min="-100" max="100" value="0" />
            </div>

            <button id="btn-toggle-eq" class="toggle-btn" title="Ecualizador">EQ</button>
            <button id="btn-toggle-lyrics" class="toggle-btn" title="Letras">LRC</button>
            <button id="btn-toggle-pl" class="toggle-btn active" title="Playlist">PL</button>
          </div>
        </section>

        <section id="panel-equalizer" class="hidden">
          <div class="panel-header">
            ECUALIZADOR
            <select id="eq-preset-select"></select>
            <button id="btn-eq-enable" class="toggle-btn active">ON</button>
          </div>
          <div id="eq-bands">
            <div class="eq-band" id="eq-preamp-band">
              <input type="range" min="-12" max="12" value="0" step="1" orient="vertical" />
              <label>PRE</label>
            </div>
            <div id="eq-band-container"></div>
          </div>
        </section>

        <section id="panel-lyrics" class="hidden">
          <div class="panel-header">
            <span>LETRAS</span>
            <span id="lyrics-source"></span>
            <button id="btn-lyrics-nudge-back" title="Atrasar la letra 100 ms">&minus;</button>
            <button id="btn-lyrics-nudge-fwd" title="Adelantar la letra 100 ms">+</button>
            <button id="btn-lyrics-auto" class="toggle-btn"
              title="Buscar sola la letra en LRCLIB cuando la pista no la trae">AUTO</button>
            <button id="btn-lyrics-fetch" title="Buscar la letra en LRCLIB">Buscar</button>
            <button id="btn-lyrics-edit" title="Editar o pegar la letra">Editar</button>
          </div>

          <div id="lyrics-view"></div>

          <div id="lyrics-editor" class="hidden">
            <textarea id="lyrics-text" spellcheck="false"
              placeholder="Pega aca la letra, una linea por renglon. Si ya trae marcas [mm:ss.xx] se respetan."></textarea>
            <div class="lyrics-tools">
              <button id="btn-lyrics-sync" title="Marcar los tiempos escuchando la cancion">Sincronizar</button>
              <button id="btn-lyrics-save">Guardar</button>
              <button id="btn-lyrics-cancel">Cancelar</button>
            </div>
          </div>

          <div id="lyrics-sync" class="hidden">
            <div id="lyrics-sync-progress"></div>
            <div id="lyrics-sync-done"></div>
            <div id="lyrics-sync-current"></div>
            <div id="lyrics-sync-next"></div>
            <div class="lyrics-tools">
              <button id="btn-lyrics-mark" title="Marca el tiempo de la linea actual">Marcar (Espacio)</button>
              <button id="btn-lyrics-undo" title="Deshacer la ultima marca">Deshacer</button>
              <button id="btn-lyrics-sync-save">Guardar</button>
              <button id="btn-lyrics-sync-cancel">Cancelar</button>
            </div>
          </div>
        </section>

        <section id="panel-playlist">
          <div class="panel-header">
            <select id="playlist-select"></select>
            <button id="btn-playlist-new" title="Nueva playlist">Nueva</button>
            <button id="btn-playlist-rename" title="Renombrar">Renombrar</button>
            <button id="btn-playlist-delete" title="Borrar">Borrar</button>
            <button id="btn-playlist-export" title="Exportar M3U">Exportar</button>
            <button id="btn-playlist-import" title="Importar M3U">Importar</button>
          </div>
          <div id="playlist-list"></div>
        </section>

      </main>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
